    // ─── SVG CHART COMPONENTS (no library needed) ─────────────────────────────
    function StackedBarChart({ data, muscles }) {
      if (!data || data.length === 0) return null;
      const maxTotal = Math.max(...data.map(d => muscles.reduce((s,m)=>s+(d[m]||0),0)), 1);
      const H=160, PAD_B=18, PAD_L=24, GAP=3;
      const chartH = H - PAD_B;
      const VW = 320;
      const barW = (VW - PAD_L - (data.length-1)*GAP) / data.length;
      return (
        <svg viewBox={`0 0 ${VW} ${H}`} width="100%" height={H}>
          {[0,0.5,1].map(t=>(
            <g key={t}>
              <line x1={PAD_L} y1={chartH-t*chartH} x2={VW} y2={chartH-t*chartH} stroke="#27272a" strokeWidth={0.5}/>
              <text x={PAD_L-3} y={chartH-t*chartH+3} textAnchor="end" fill="#52525b" fontSize={7}>{Math.round(t*maxTotal)}</text>
            </g>
          ))}
          {data.map((d,i)=>{
            const x=PAD_L+i*(barW+GAP);
            let sy=chartH;
            const bars = muscles.map(m=>{
              if (!d[m]) return null;
              const h=(d[m]/maxTotal)*chartH;
              sy-=h;
              return <rect key={m} x={x} y={sy} width={barW} height={h} fill={MC[m]||'#98a8b4'} rx={1}/>;
            });
            return <g key={i}>{bars}<text x={x+barW/2} y={H-3} textAnchor="middle" fill="#52525b" fontSize={7}>{d.label}</text></g>;
          })}
        </svg>
      );
    }
    function Sparkline({ data, color, height=56 }) {
      if (!data || data.length < 2) return null;
      const W=300, H=height;
      const vals=data.map(d=>d.weight);
      const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
      const pts=vals.map((v,i)=>[
        (i/(vals.length-1))*W,
        H-((v-mn)/rng)*(H-8)-4
      ]);
      const d=pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      return (
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none">
          <path d={d} fill="none" stroke={color} strokeWidth={2}/>
        </svg>
      );

    const DB_NAME = "FitnessTrackerDB", DB_VERSION = 1, STORE = "workouts";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE))
            db.createObjectStore(STORE, { keyPath: "id" });
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror   = ()  => reject(req.error);
      });
    }
    function idbGetAll(db) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE,"readonly").objectStore(STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror   = () => reject(req.error);
      });
    }
    function idbPut(db, item) {
      return new Promise((resolve, reject) => {
        const req = db.transaction(STORE,"readwrite").objectStore(STORE).put(item);
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    }
    function idbPutBatch(db, items) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE,"readwrite"), store = tx.objectStore(STORE);
        items.forEach(i => store.put(i));
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
      });
    }

    function genHistory() {
      const base = new Date("2026-02-16");
      const workouts = [], counts = {1:0,2:0,3:0};
      for (let week = 0; week < 13; week++) {
        [0,2,4].forEach((off,i) => {
          const date = new Date(base);
          date.setDate(base.getDate() + week*7 + off);
          if (date > new Date("2026-05-17")) return;
          const day = DAYS[i%3], n = counts[day.id]++;
          const exercises = day.exercises.map(ex => {
            const w = +(SW[ex.name]+(PG[ex.name]||0)*n).toFixed(1);
            return { name:ex.name, muscle:ex.muscle, repsTarget:ex.rep,
              sets:Array.from({length:ex.sets},(_,si)=>({setNum:si+1,weight:w,reps:ex.rep.includes("s")?0:12,completed:true})) };
          });
          workouts.push({ id:`seed_w${workouts.length+1}`, dayId:day.id, name:day.name,
            date:date.toISOString().split("T")[0], duration:2400+Math.floor(Math.random()*600), exercises, prs:[] });
        });
      }
      workouts.sort((a,b)=>a.date.localeCompare(b.date));
      const bests = {};
      workouts.forEach(w => w.exercises.forEach(ex => {
        if (ex.repsTarget.includes("s")) return;
        const mx = Math.max(...ex.sets.map(s=>s.weight));
        if (!bests[ex.name]||mx>bests[ex.name]) { bests[ex.name]=mx; if(!w.prs.includes(ex.name)) w.prs.push(ex.name); }
      }));
      return workouts;
    }

    function computePRs(hist) {
      const prs = {};
      hist.forEach(w => w.exercises.forEach(ex => {
        if (ex.repsTarget.includes("s")) return;
        ex.sets.forEach(s => {
          if (s.completed&&s.weight>0&&(!prs[ex.name]||s.weight>prs[ex.name].weight))
            prs[ex.name] = {weight:s.weight,reps:s.reps,date:w.date,muscle:ex.muscle};
        });
      }));
      return prs;
    }

    function getStreak(hist) {
      const sorted = [...hist].sort((a,b)=>b.date.localeCompare(a.date));
      let streak=0; const now=new Date(); now.setHours(0,0,0,0); let check=now;
      for (const w of sorted) {
        const d=new Date(w.date+"T00:00:00");
        if (Math.floor((check-d)/864e5)<=1){streak++;check=d;}else break;
      }
      return streak;
    }

    function getWeekCount(hist) {
      const today=new Date(); today.setHours(0,0,0,0);
      const mon=new Date(today), dow=today.getDay();
      mon.setDate(today.getDate()-(dow===0?6:dow-1));
      return hist.filter(w=>new Date(w.date+"T00:00:00")>=mon).length;
    }

    function fmtDate(s) {
      return new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
    }
    function fmtDur(s) { return `${Math.floor(s/60)}m`; }

    // ─── WEEKLY REPORT GENERATOR ──────────────────────────────────────────────
    function buildReportText(history, prs) {
      const today = new Date(); today.setHours(0,0,0,0);
      const dow   = today.getDay();
      const mon   = new Date(today); mon.setDate(today.getDate()-(dow===0?6:dow-1));
      const sun   = new Date(mon);   sun.setDate(mon.getDate()+6);

      const weekWorkouts = history
        .filter(w => { const d=new Date(w.date+"T00:00:00"); return d>=mon&&d<=today; })
        .sort((a,b)=>a.date.localeCompare(b.date));

      const weekPRs = weekWorkouts.flatMap(w =>
        (w.prs||[]).map(name => { const p=prs[name]; return p?`${name} — ${p.weight} kg`:null; }).filter(Boolean)
      );

      const totalSets = weekWorkouts.reduce((n,w)=>n+w.exercises.reduce((m,ex)=>m+ex.sets.filter(s=>s.completed).length,0),0);
      const totalMins = Math.round(weekWorkouts.reduce((n,w)=>n+(w.duration||0),0)/60);
      const streak    = getStreak(history);
      const daysLeft  = Math.max(0,Math.ceil((GOAL_DATE-new Date())/864e5));

      const range = `${mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${sun.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;

      let r = "";
      r += `WEEKLY FITNESS REPORT\n`;
      r += `Week of ${range}\n`;
      r += `${"─".repeat(42)}\n\n`;

      r += `WORKOUTS THIS WEEK: ${weekWorkouts.length} / 3\n`;
      if (weekWorkouts.length > 0) {
        weekWorkouts.forEach(w => {
          const dur = w.duration ? ` (${Math.floor(w.duration/60)} min)` : "";
          r += `  ✓  ${fmtDate(w.date)} — ${w.name}${dur}\n`;
        });
      } else {
        r += `  No workouts logged this week yet.\n`;
      }

      if (weekPRs.length > 0) {
        r += `\nNEW PERSONAL RECORDS THIS WEEK:\n`;
        weekPRs.forEach(p => { r += `  ★  ${p}\n`; });
      }

      r += `\nWEEKLY VOLUME:\n`;
      r += `  ${totalSets} sets completed\n`;
      r += `  ${totalMins} min total training time\n`;

      r += `\nCURRENT STREAK: ${streak} day${streak!==1?"s":""}\n`;

      r += `\nGOAL PROGRESS:\n`;
      r += `  Current weight:  99.5 kg\n`;
      r += `  Target:          86.0 kg by Dec 31, 2026\n`;
      r += `  Lost so far:     5.0 kg (27% of goal)\n`;
      r += `  Time remaining:  ${Math.floor(daysLeft/7)} weeks\n`;

      r += `\n${"─".repeat(42)}\n`;
      r += `Keep it up, Aykun!\n\n`;
      r += `— Your Fitness Tracker`;

      return { text: r, range };
    }

    // ─── DASHBOARD ────────────────────────────────────────────────────────────
    function Dashboard({ history, prs, onStart, onSendReport, sending }) {
      const topPrs    = Object.entries(prs).filter(([,v])=>v.weight>0).sort((a,b)=>b[1].weight-a[1].weight).slice(0,3);
      const streak    = getStreak(history);
      const weekCount = getWeekCount(history);
      const startKg=104.5,currKg=99.5,goalKg=86;
      const pct       = Math.round(((startKg-currKg)/(startKg-goalKg))*100);
      const daysLeft  = Math.max(0,Math.ceil((GOAL_DATE-new Date())/864e5));
      const todayIdx  = (()=>{const d=new Date().getDay();return d===0?6:d-1;})();
      const isSunday  = new Date().getDay()===0;

      return (
        <div className="p-4 space-y-4">

          {/* Sunday report banner */}
          {isSunday && (

              <button

                style={{backgroundColor:"rgba(200,176,140,0.20)",color:SAND,border:`1px solid rgba(200,176,140,0.40)`}}

            </div>

          {/* EmailJS not configured notice */}

            <div className="rounded-2xl p-3 flex items-center gap-3"
              style={{backgroundColor:A_DIM,border:`1px solid ${A_RING}`}}>
              <Dot color={A} size={7}/>
              <div className="text-xs text-zinc-400 leading-snug">
                <span className="font-black" style={{color:A}}>Email reports not active yet. </span>
                Set up EmailJS — see instructions at the top of this HTML file.
              </div>
            </div>
          )}

          {/* Goal progress */}
          <div className="rounded-2xl bg-zinc-900 border border-zinc-800 p-4">
            <div className="flex justify-between items-center mb-2">
              <span className="text-zinc-400 text-xs uppercase tracking-widest font-bold">Body Recomposition</span>
              <span className="text-xs font-black tracking-wide" style={{color:A}}>Dec 31, 2026</span>

            <div className="flex justify-between text-sm mb-2">

            <div className="flex justify-between text-xs text-zinc-500 mt-1.5">

              <span style={{color:A}} className="font-bold">{Math.floor(daysLeft/7)}w {daysLeft%7}d left</span>

          {/* Stats */}

              <div key={s.label} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 text-center">

            <div className="grid grid-cols-7 gap-1">
              {WEEKLY_SCHEDULE.map((s,i)=>{

                return (
                  <div key={s.day} className="rounded-xl p-1.5 text-center flex flex-col items-center gap-1"
                    style={{backgroundColor:isToday?A_DIM:"rgba(255,255,255,0.03)",border:`1px solid ${isToday?A_RING:"transparent"}`}}>

                  <span className="text-zinc-600">›</span>
                </button>
              ))}
            </div>
          </div>

          {/* Top PRs */}
          {topPrs.length>0&&(
            <div>
              <div className="text-xs uppercase tracking-widest text-zinc-500 font-bold mb-3">Personal Records</div>
              <div className="space-y-2">

                      <div className="font-black text-white text-lg leading-tight">{name}</div>
                      <div className="text-xs text-zinc-500">{pr.muscle} · {fmtDate(pr.date)}</div>

                    <div className="text-right">

                      <div className="text-xs text-zinc-500">× {pr.reps} reps</div>

    // ─── COLLAPSIBLE ──────────────────────────────────────────────────────────

          </button>
          {open&&<div className="px-4 pb-4 pt-2 space-y-2 border-t border-zinc-800">
            {items.map((item,i)=>(
              <div key={i} className="flex items-center gap-2 text-sm text-zinc-400">
                <Dot color={dotColor} size={6}/>{item}
              </div>
            ))}

      );

    // ─── EXERCISE CARD ────────────────────────────────────────────────────────
    function ExerciseCard({ex,exIdx,onUpdateSet,onToggleSet,onAddSet}) {
      const color=MC[ex.muscle]||"#98a8b4";
      return (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
          <div className="px-4 py-3 border-b border-zinc-800 flex items-start gap-3">
            <Dot color={color} size={10}/>
            <div>
              <div className="font-black text-white text-xl leading-tight">{ex.name}</div>
              <div className="text-xs font-bold uppercase tracking-widest mt-0.5" style={{color}}>{ex.muscle} · {ex.repsTarget} reps</div>
            </div>
          </div>
          <div className="grid px-1" style={{gridTemplateColumns:"28px 1fr 68px 68px 38px"}}>
            {["#","Previous","kg","Reps","Done"].map(h=>(
              <div key={h} className="text-xs text-zinc-600 px-1 py-2 text-center font-bold uppercase tracking-wider">{h}</div>
            ))}
          </div>
          {ex.sets.map((set,si)=>(
            <div key={si} className="grid px-1 border-t border-zinc-800/50 items-center"
              style={{gridTemplateColumns:"28px 1fr 68px 68px 38px",backgroundColor:set.completed?SAGE_DIM:"transparent"}}>
              <div className="text-center text-sm font-black text-zinc-500 py-2">{set.setNum}</div>
              <div className="text-xs text-zinc-600 py-2 px-1 truncate">{set.prevWeight?`${set.prevWeight}kg×${set.prevReps}`:"—"}</div>
              <div className="py-1.5 px-0.5">
                <input type="number" inputMode="decimal" value={set.weight}
                  onChange={e=>onUpdateSet(exIdx,si,"weight",e.target.value)}
                  className="w-full text-center py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 text-white font-black text-sm focus:outline-none"/>
              </div>
              <div className="py-1.5 px-0.5">
                <input type="number" inputMode="numeric" value={set.reps}
                  onChange={e=>onUpdateSet(exIdx,si,"reps",e.target.value)}
                  className="w-full text-center py-1.5 rounded-lg bg-zinc-800 border border-zinc-700 text-white font-black text-sm focus:outline-none"/>

              <div className="flex justify-center py-2">

                  className="w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-black"

            </div>

            className="w-full py-2.5 text-xs font-black uppercase tracking-widest border-t border-zinc-800 text-zinc-600 hover:text-zinc-400">

    // ─── WORKOUT SCREEN ───────────────────────────────────────────────────────
    function WorkoutScreen({workout,elapsed,showPicker,setShowPicker,onUpdateSet,onToggleSet,onAddSet,onAddExercise,onFinish,onDiscard}) {
      if (!workout) return (
        <div className="flex flex-col items-center justify-center min-h-96 text-center p-8">
          <div className="text-2xl font-black text-white uppercase mb-2">No Active Workout</div>
          <div className="text-zinc-500 text-sm">Launch one from the Dashboard</div>
        </div>
      );
      const completedSets=workout.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>s.completed).length,0);
      const totalSets=workout.exercises.reduce((n,ex)=>n+ex.sets.length,0);
      return (
        <div>
          <div className="sticky top-0 z-10 border-b border-zinc-800 px-4 pt-4 pb-3" style={{backgroundColor:"rgba(9,9,11,0.96)"}}>
            <div className="flex items-start justify-between mb-3">
              <div>
                <div className="text-xs text-zinc-500 uppercase tracking-widest font-bold">
                  {new Date(workout.date+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
                </div>
                <div className="text-2xl font-black text-white uppercase leading-tight">{workout.name}</div>
                <div className="text-xs text-zinc-500 mt-0.5">{completedSets} / {totalSets} sets complete</div>
              </div>
              <div className="rounded-xl px-3 py-2 text-right" style={{backgroundColor:A_DIM,border:`1px solid ${A_RING}`}}>
                <div className="font-mono font-black text-2xl leading-none" style={{color:A}}>{fmtElap(elapsed)}</div>
                <div className="text-xs text-zinc-500 mt-0.5">elapsed</div>
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={onFinish} className="flex-1 text-white font-black py-2.5 px-4 rounded-xl text-sm uppercase tracking-wider hover:opacity-90"
                style={{backgroundColor:A}}>Finish Workout</button>
              <button onClick={onDiscard} className="bg-zinc-800 hover:bg-zinc-700 text-zinc-400 font-black py-2.5 px-4 rounded-xl text-sm uppercase tracking-wider">
                Discard
              </button>
            </div>
          </div>
          <div className="p-4 space-y-4 pb-10">
            <Collapsible dotColor="#c8a888" title="Warm-Up" subtitle="5 min" defaultOpen={true}
              items={["5 min light cardio — treadmill or stationary bike","10 leg swings each side","10 arm circles forward and backward","10 hip circles each direction","Cat-cow stretch × 10 slow reps","Bird-dog × 10 each side"]}/>
            {workout.exercises.map((ex,ei)=>(
              <ExerciseCard key={`${ex.name}-${ei}`} ex={ex} exIdx={ei}
                onUpdateSet={onUpdateSet} onToggleSet={onToggleSet} onAddSet={()=>onAddSet(ei)}/>

              className="w-full border-2 border-dashed border-zinc-700 text-zinc-500 font-black py-3.5 rounded-2xl text-sm uppercase tracking-widest hover:border-zinc-600 hover:text-zinc-400">

              items={["Child's pose hold 45–60 seconds","Hip flexor stretch 30s each side","Seated hamstring stretch 30s each side","Chest doorway stretch 30 seconds","Thoracic foam roll 60 seconds","5 deep diaphragmatic breaths"]}/>
          </div>
          {showPicker&&(
            <div className="fixed inset-0 z-50 flex flex-col justify-end" style={{backgroundColor:"rgba(0,0,0,0.70)"}}

              <div className="bg-zinc-900 rounded-t-3xl max-h-96 flex flex-col" style={{borderTop:`1px solid ${A_RING}`}}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-800 flex-shrink-0">

                  <button onClick={()=>setShowPicker(false)} className="text-zinc-400 hover:text-white text-3xl leading-none">×</button>
                </div>
                <div className="overflow-y-auto">
                  {ALL_EX.map(ex=>(
                    <button key={ex.name} onClick={()=>onAddExercise(ex)}
                      className="w-full flex items-center justify-between px-5 py-3.5 hover:bg-zinc-800 border-b border-zinc-800/50">
                      <span className="font-bold text-white text-lg">{ex.name}</span>
                      <span className="text-xs font-black uppercase tracking-wider" style={{color:MC[ex.muscle]||"#98a8b4"}}>{ex.muscle}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── HISTORY ──────────────────────────────────────────────────────────────
    function HistoryScreen({history,onExport,onSendReport,sending}) {

                {sending?"Sending…":"Email"}

                className="text-xs font-black uppercase tracking-wider px-3 py-2 rounded-xl"
                style={{backgroundColor:A_DIM,border:`1px solid ${A_RING}`,color:A}}>

          const key=mon.toISOString().split("T")[0],label=`${mon.getDate()}/${mon.getMonth()+1}`;

          w.exercises.forEach(ex=>{const n=ex.sets.filter(s=>s.completed).length;if(n>0)weeks[key][ex.muscle]=(weeks[key][ex.muscle]||0)+n;});

    // ─── ROOT ─────────────────────────────────────────────────────────────────
    function FitnessTracker() {
      const [screen,setScreen]               = useState("dashboard");
      const [history,setHistory]             = useState([]);
      const [prs,setPrs]                     = useState({});
      const [activeWorkout,setActiveWorkout] = useState(null);
      const [elapsed,setElapsed]             = useState(0);
      const [showPicker,setShowPicker]       = useState(false);
      const [loading,setLoading]             = useState(true);
      const [toast,setToast]                 = useState(null);
      const [sending,setSending]             = useState(false);
      const dbRef = useRef(null);

      function showToast(message, type="info", duration=2500) {
        setToast({message,type});
        setTimeout(()=>setToast(null), duration);
      }

      // Load from IndexedDB
      useEffect(()=>{
        async function init() {
          try {
            const db=await openDB(); dbRef.current=db;
            const stored=await idbGetAll(db);
            if (stored.length===0) {
              const seed=genHistory(); await idbPutBatch(db,seed);
              setHistory(seed); setPrs(computePRs(seed));
            } else {
              const sorted=stored.sort((a,b)=>a.date.localeCompare(b.date));
              setHistory(sorted); setPrs(computePRs(sorted));
            }
          } catch(err) {
            const seed=genHistory(); setHistory(seed); setPrs(computePRs(seed));
          }
          setLoading(false);
        }
        init();
      },[]);

      // Timer
      useEffect(()=>{
        if (!activeWorkout) return;
        const id=setInterval(()=>setElapsed(e=>e+1),1000);
        return ()=>clearInterval(id);
      },[!!activeWorkout]);

      // Send weekly report
      async function handleSendReport() {
        if (!EMAILJS_READY) { showToast("EmailJS not set up yet","error",4000); return; }
        setSending(true);
        try {
          await sendWeeklyReport(history, prs);
          showToast(`Report sent to ${REPORT_EMAIL}`,"saved");
        } catch(err) {
          showToast("Failed to send — check EmailJS config","error",4000);
        }
        setSending(false);
      }

      // Export JSON backup
      function exportData() {
        const blob=new Blob([JSON.stringify(history,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob), a=document.createElement("a");
        a.href=url; a.download=`fitness-backup-${new Date().toISOString().split("T")[0]}.json`;
        a.click(); URL.revokeObjectURL(url);
        showToast("Backup downloaded","saved");
      }

      // Workout functions
      function startWorkout(dayId) {
        const day=DAYS.find(d=>d.id===dayId), prev=[...history].reverse().find(h=>h.dayId===dayId);
        const exercises=day.exercises.map(ex=>{
          const prevEx=prev?.exercises.find(e=>e.name===ex.name), ps=prevEx?.sets||[];
          return { name:ex.name,muscle:ex.muscle,repsTarget:ex.rep,
            sets:Array.from({length:ex.sets},(_,i)=>({setNum:i+1,prevWeight:ps[i]?.weight||null,prevReps:ps[i]?.reps||null,weight:ps[i]?.weight||"",reps:ps[i]?.reps||"",completed:false})) };
        });
        setActiveWorkout({dayId,name:day.name,exercises,date:new Date().toISOString().split("T")[0]});
        setElapsed(0); setScreen("workout");
      }
      function updateSet(ei,si,field,value) {
        setActiveWorkout(w=>({...w,exercises:w.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,[field]:value})})}));
      }
      function toggleSet(ei,si) {
        setActiveWorkout(w=>({...w,exercises:w.exercises.map((ex,i)=>i!==ei?ex:{...ex,sets:ex.sets.map((s,j)=>j!==si?s:{...s,completed:!s.completed})})}));
      }
      function addSet(ei) {
        setActiveWorkout(w=>({...w,exercises:w.exercises.map((ex,i)=>{
          if(i!==ei)return ex;
          const last=ex.sets[ex.sets.length-1];
          return {...ex,sets:[...ex.sets,{setNum:ex.sets.length+1,prevWeight:null,prevReps:null,weight:last?.weight||"",reps:last?.reps||"",completed:false}]};
        })}));
      }
      function addExercise(ex) {
        setActiveWorkout(w=>({...w,exercises:[...w.exercises,{name:ex.name,muscle:ex.muscle,repsTarget:"10–15",sets:[{setNum:1,prevWeight:null,prevReps:null,weight:"",reps:"",completed:false}]}]}));
        setShowPicker(false);
      }
      async function finishWorkout() {
        const exs=activeWorkout.exercises
          .map(ex=>({...ex,sets:ex.sets.filter(s=>s.completed).map(s=>({...s,weight:parseFloat(s.weight)||0,reps:parseInt(s.reps)||0}))}))
          .filter(ex=>ex.sets.length>0);
        const workout={id:`w${Date.now()}`,dayId:activeWorkout.dayId,name:activeWorkout.name,date:activeWorkout.date,duration:elapsed,exercises:exs,prs:[]};
        exs.forEach(ex=>ex.sets.forEach(s=>{if(s.weight>0&&(!prs[ex.name]||s.weight>prs[ex.name].weight)&&!workout.prs.includes(ex.name))workout.prs.push(ex.name);}));
        const newH=[...history,workout]; setHistory(newH); setPrs(computePRs(newH));
        setActiveWorkout(null); setElapsed(0); setScreen("history");
        if (dbRef.current) {
          try { await idbPut(dbRef.current,workout); showToast("Workout saved","saved"); }
          catch(err) { showToast("Saved in memory only","error",3500); }
        }
      }
      function discard() { setActiveWorkout(null); setElapsed(0); setScreen("dashboard"); }

      if (loading) return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-zinc-950 gap-3">
          <div style={{width:40,height:40,border:"3px solid #27272a",borderTopColor:A,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
          <div className="text-zinc-600 text-xs font-black uppercase tracking-widest">Loading</div>
        </div>
      );

      return (
        <div className="bg-zinc-950 min-h-screen text-white flex flex-col max-w-md mx-auto relative"
          style={{fontFamily:"'Barlow Condensed','Arial Narrow',sans-serif"}}>
          {toast&&<Toast message={toast.message} type={toast.type}/>}
          <div className="flex-1 overflow-y-auto pb-20">
            {screen==="dashboard"&&<Dashboard history={history} prs={prs} onStart={startWorkout} onSendReport={handleSendReport} sending={sending}/>}
            {screen==="workout"&&<WorkoutScreen workout={activeWorkout} elapsed={elapsed} showPicker={showPicker} setShowPicker={setShowPicker}
              onUpdateSet={updateSet} onToggleSet={toggleSet} onAddSet={addSet} onAddExercise={addExercise} onFinish={finishWorkout} onDiscard={discard}/>}
            {screen==="history"&&<HistoryScreen history={history} onExport={exportData} onSendReport={handleSendReport} sending={sending}/>}
            {screen==="progress"&&<ProgressScreen history={history} prs={prs}/>}
            {screen==="meals"&&<MealsScreen/>}
          </div>
          <BottomNav screen={screen} setScreen={setScreen} activeWorkout={activeWorkout}/>
        </div>
      );
    }

    setStatus('Mounting React…');
    ReactDOM.createRoot(document.getElementById("root")).render(<FitnessTracker/>);
  </script>
</body>
</html>
