    // ─── SVG CHARTS ──────────────────────────────────────────────────────────
    function StackedBarChart({ data, muscles }) {
      if (!data || data.length === 0) return null;
      const maxTotal = Math.max(...data.map(d => muscles.reduce((s,m)=>s+(d[m]||0),0)), 1);
      const H=160, PAD_B=18, PAD_L=24, GAP=3, VW=320;
      const chartH=H-PAD_B, barW=(VW-PAD_L-(data.length-1)*GAP)/data.length;
      return (
        <svg viewBox={`0 0 ${VW} ${H}`} width="100%" height={H}>
          {[0,0.5,1].map(t=>(
            <g key={t}>
              <line x1={PAD_L} y1={chartH-t*chartH} x2={VW} y2={chartH-t*chartH} stroke="#27272a" strokeWidth={0.5}/>
              <text x={PAD_L-3} y={chartH-t*chartH+3} textAnchor="end" fill="#52525b" fontSize={7}>{Math.round(t*maxTotal)}</text>
            </g>
          ))}
          {data.map((d,i)=>{
            const x=PAD_L+i*(barW+GAP); let sy=chartH;
            return <g key={i}>{muscles.map(m=>{if(!d[m])return null;const h=(d[m]/maxTotal)*chartH;sy-=h;return <rect key={m} x={x} y={sy} width={barW} height={h} fill={MC[m]||'#98a8b4'} rx={1}/>;})}<text x={x+barW/2} y={H-3} textAnchor="middle" fill="#52525b" fontSize={7}>{d.label}</text></g>;
          })}
        </svg>
      );
    }
    function Sparkline({ data, color, height=56 }) {
      if (!data || data.length < 2) return null;
      const W=300, H=height, vals=data.map(d=>d.weight);
      const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
      const pts=vals.map((v,i)=>[(i/(vals.length-1))*W, H-((v-mn)/rng)*(H-8)-4]);
      const d=pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
      return <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} preserveAspectRatio="none"><path d={d} fill="none" stroke={color} strokeWidth={2}/></svg>;
    }

    // ─── INDEXEDDB ────────────────────────────────────────────────────────────
    const DB_NAME="FitnessTrackerDB", DB_VERSION=1, STORE="workouts";
    function openDB() {
      return new Promise((resolve,reject)=>{
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"});};
        req.onsuccess=e=>resolve(e.target.result);
        req.onerror=()=>reject(req.error);
      });
    }
    function idbGetAll(db){return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readonly").objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);});}
    function idbPut(db,item){return new Promise((resolve,reject)=>{const req=db.transaction(STORE,"readwrite").objectStore(STORE).put(item);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error);});}
    function idbPutBatch(db,items){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite"),store=tx.objectStore(STORE);items.forEach(i=>store.put(i));tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}

    function genHistory(){
      const base=new Date("2026-02-16"),workouts=[],counts={1:0,2:0,3:0};
      for(let week=0;week<13;week++){[0,2,4].forEach((off,i)=>{
        const date=new Date(base);date.setDate(base.getDate()+week*7+off);
        if(date>new Date("2026-05-17"))return;
        const day=DAYS[i%3],n=counts[day.id]++;
        const exercises=day.exercises.map(ex=>{const w=+(SW[ex.name]+(PG[ex.name]||0)*n).toFixed(1);return{name:ex.name,muscle:ex.muscle,repsTarget:ex.rep,sets:Array.from({length:ex.sets},(_,si)=>({setNum:si+1,weight:w,reps:ex.rep.includes("s")?0:12,completed:true}))};});
        workouts.push({id:`seed_w${workouts.length+1}`,dayId:day.id,name:day.name,date:date.toISOString().split("T")[0],duration:2400+Math.floor(Math.random()*600),exercises,prs:[]});
      });}
      workouts.sort((a,b)=>a.date.localeCompare(b.date));
      const bests={};
      workouts.forEach(w=>w.exercises.forEach(ex=>{if(ex.repsTarget.includes("s"))return;const mx=Math.max(...ex.sets.map(s=>s.weight));if(!bests[ex.name]||mx>bests[ex.name]){bests[ex.name]=mx;if(!w.prs.includes(ex.name))w.prs.push(ex.name);}}));
      return workouts;
    }
    function computePRs(hist){
      const prs={};
      hist.forEach(w=>w.exercises.forEach(ex=>{if(ex.repsTarget.includes("s"))return;ex.sets.forEach(s=>{if(s.completed&&s.weight>0&&(!prs[ex.name]||s.weight>prs[ex.name].weight))prs[ex.name]={weight:s.weight,reps:s.reps,date:w.date,muscle:ex.muscle};});}));
      return prs;
    }
    function getStreak(hist){
      const sorted=[...hist].sort((a,b)=>b.date.localeCompare(a.date));
      let streak=0;const now=new Date();now.setHours(0,0,0,0);let check=now;
      for(const w of sorted){const d=new Date(w.date+"T00:00:00");if(Math.floor((check-d)/864e5)<=1){streak++;check=d;}else break;}
      return streak;
    }
    function getWeekCount(hist){
      const today=new Date();today.setHours(0,0,0,0);const mon=new Date(today),dow=today.getDay();
      mon.setDate(today.getDate()-(dow===0?6:dow-1));
      return hist.filter(w=>new Date(w.date+"T00:00:00")>=mon).length;
    }
    function fmtDate(s){return new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
    function fmtDur(s){return `${Math.floor(s/60)}m`;}
    function fmtElap(s){const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;}

    // ─── REPORT ───────────────────────────────────────────────────────────────
    function buildReportText(history, prs, profile) {
      const today=new Date();today.setHours(0,0,0,0);
      const dow=today.getDay(),mon=new Date(today);mon.setDate(today.getDate()-(dow===0?6:dow-1));
      const sun=new Date(mon);sun.setDate(mon.getDate()+6);
      const weekWorkouts=history.filter(w=>{const d=new Date(w.date+"T00:00:00");return d>=mon&&d<=today;}).sort((a,b)=>a.date.localeCompare(b.date));
      const weekPRs=weekWorkouts.flatMap(w=>(w.prs||[]).map(name=>{const p=prs[name];return p?`${name} — ${p.weight} kg`:null;}).filter(Boolean));
      const totalSets=weekWorkouts.reduce((n,w)=>n+w.exercises.reduce((m,ex)=>m+ex.sets.filter(s=>s.completed).length,0),0);
      const totalMins=Math.round(weekWorkouts.reduce((n,w)=>n+(w.duration||0),0)/60);
      const streak=getStreak(history);
      const goalDate=new Date(profile.goalDate+"T23:59:59");
      const daysLeft=Math.max(0,Math.ceil((goalDate-new Date())/864e5));
      const range=`${mon.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${sun.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
      const lost=+(profile.startWeight-profile.currentWeight).toFixed(1);
      const pct=Math.round((lost/(profile.startWeight-profile.goalWeight))*100);
      let r=`WEEKLY FITNESS REPORT\nWeek of ${range}\n${"─".repeat(42)}\n\n`;
      r+=`WORKOUTS THIS WEEK: ${weekWorkouts.length} / 3\n`;
      weekWorkouts.length>0?weekWorkouts.forEach(w=>{r+=`  ✓  ${fmtDate(w.date)} — ${w.name}${w.duration?` (${Math.floor(w.duration/60)} min)`:""}\n`;}):r+=`  No workouts logged this week yet.\n`;
      if(weekPRs.length>0){r+=`\nNEW PERSONAL RECORDS THIS WEEK:\n`;weekPRs.forEach(p=>{r+=`  ★  ${p}\n`;});}
      r+=`\nWEEKLY VOLUME:\n  ${totalSets} sets completed\n  ${totalMins} min total training time\n`;
      r+=`\nCURRENT STREAK: ${streak} day${streak!==1?"s":""}\n`;
      r+=`\nGOAL PROGRESS:\n  Current weight:  ${profile.currentWeight} kg\n  Target:          ${profile.goalWeight} kg by ${new Date(profile.goalDate).toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}\n  Lost so far:     ${lost} kg (${pct}% of goal)\n  Time remaining:  ${Math.floor(daysLeft/7)} weeks\n`;
      r+=`\n${"─".repeat(42)}\nKeep it up, Aykun!\n\n— Your Fitness Tracker`;
      return {text:r,range};
    }

                className="w-full py-4 rounded-2xl font-black text-lg uppercase tracking-widest"
                style={{backgroundColor:A,color:"#fff"}}>Update PR</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── DASHBOARD ────────────────────────────────────────────────────────────
    function Dashboard({history,prs,profile,onStart,onSendReport,sending,onEditProfile}){
      const topPrs=Object.entries(prs).filter(([,v])=>v.weight>0).sort((a,b)=>b[1].weight-a[1].weight).slice(0,3);
      const streak=getStreak(history),weekCount=getWeekCount(history);
      const{currentWeight:cw,startWeight:sw,goalWeight:gw,goalDate:gd}=profile;
      const pct=Math.max(0,Math.round(((sw-cw)/(sw-gw))*100));
      const goalDateObj=new Date(gd+"T23:59:59");
      const daysLeft=Math.max(0,Math.ceil((goalDateObj-new Date())/864e5));
      const todayIdx=(()=>{const d=new Date().getDay();return d===0?6:d-1;})();
      const isSunday=new Date().getDay()===0;
      const hour=new Date().getHours();
      const greeting=hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
      return (
        <div className="p-5 space-y-5">
          {/* Header with avatar */}
          <div className="flex items-center justify-between">
            <div>
              <div className="text-zinc-500 text-sm font-bold uppercase tracking-widest">{greeting}</div>
              <div className="text-4xl font-black text-white leading-tight">Aykun 👋</div>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={onEditProfile} className="w-10 h-10 rounded-xl flex items-center justify-center" style={{backgroundColor:"rgba(255,255,255,0.05)",border:"1px solid #3f3f46"}}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              </button>
              <img src={AVATAR_SRC} className="w-14 h-14 rounded-2xl" alt="Aykun" style={{objectFit:"cover",border:"2px solid #3f3f46"}}/>
            </div>
          </div>

          {/* Sunday report banner */}
          {isSunday&&(
            <div className="rounded-2xl p-4 flex items-center justify-between" style={{backgroundColor:"rgba(200,176,140,0.10)",border:`1px solid rgba(200,176,140,0.30)`}}>
              <div><div className="font-black text-white text-lg leading-tight">Weekly Report Ready</div><div className="text-xs mt-0.5" style={{color:SAND}}>Send this week's summary to {REPORT_EMAIL}</div></div>
              <button onClick={onSendReport} disabled={sending||!EMAILJS_READY} className="font-black text-sm px-4 py-2 rounded-xl flex-shrink-0 ml-3 disabled:opacity-50" style={{backgroundColor:"rgba(200,176,140,0.20)",color:SAND,border:`1px solid rgba(200,176,140,0.40)`}}>{sending?"Sending…":"Send"}</button>
            </div>
          )}

          {/* Goal progress */}
          <div className="rounded-2xl bg-zinc-900 border border-zinc-800 p-4">
            <div className="flex justify-between items-center mb-2">
              <span className="text-zinc-400 text-xs uppercase tracking-widest font-bold">Body Recomposition</span>
              <span className="text-xs font-black tracking-wide" style={{color:A}}>{new Date(gd+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}</span>
            </div>
            <div className="flex justify-between text-sm mb-2">
              <span className="text-zinc-300 font-bold">{cw} kg now</span>
              <span className="font-black" style={{color:SAGE}}>{gw} kg goal</span>
            </div>
            <div className="w-full bg-zinc-800 rounded-full h-2.5 overflow-hidden">
              <div style={{width:`${Math.min(pct,100)}%`,background:`linear-gradient(to right,#5a8096,${A})`}} className="h-full rounded-full"/>
            </div>
            <div className="flex justify-between text-xs text-zinc-500 mt-1.5">
              <span>{+(sw-cw).toFixed(1)} kg of {+(sw-gw).toFixed(1)} kg lost · {pct}%</span>
              <span style={{color:A}} className="font-bold">{Math.floor(daysLeft/7)}w {daysLeft%7}d left</span>
            </div>
          </div>

          {/* Stats */}
          <div className="grid grid-cols-3 gap-3">
            {[{label:"Streak",value:streak,sub:"days"},{label:"This Week",value:weekCount,sub:"sessions"},{label:"Total",value:history.length,sub:"workouts"}].map(s=>(
              <div key={s.label} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 text-center">
                <div className="text-xs text-zinc-600 uppercase tracking-widest font-bold mb-1">{s.label}</div>
                <div className="text-4xl font-black text-white leading-none">{s.value}</div>
                <div className="text-xs text-zinc-600 mt-1">{s.sub}</div>
              </div>
            ))}
          </div>

          {/* Weekly schedule */}
          <div className="rounded-2xl bg-zinc-900 border border-zinc-800 p-4">
            <div className="text-xs uppercase tracking-widest text-zinc-500 font-bold mb-3">Weekly Schedule</div>
            <div className="grid grid-cols-7 gap-1">
              {WEEKLY_SCHEDULE.map((s,i)=>{
                const isToday=i===todayIdx,isRest=!s.gym&&!s.bike;
                return (
                  <div key={s.day} className="rounded-xl p-1.5 text-center flex flex-col items-center gap-1" style={{backgroundColor:isToday?A_DIM:"rgba(255,255,255,0.03)",border:`1px solid ${isToday?A_RING:"transparent"}`}}>
                    <div className="text-xs font-black uppercase" style={{color:isToday?A:"#52525b"}}>{s.day}</div>
                    {s.gym&&<span className="text-xs font-black px-1 py-0.5 rounded leading-none" style={{backgroundColor:"rgba(138,180,212,0.15)",color:A}}>Gym</span>}
                    {s.bike&&<span className="text-xs font-black px-1 py-0.5 rounded leading-none" style={{backgroundColor:"rgba(132,192,164,0.15)",color:SAGE}}>Bike</span>}
                    {isRest&&<span className="text-xs text-zinc-700 font-bold">Rest</span>}
                  </div>
                );
              })}
            </div>
            <div className="text-xs text-zinc-600 mt-3">Cycling ~7 km per day · 3.5 km each way</div>
          </div>

          {/* Start workout */}
          <div>
            <div className="text-xs uppercase tracking-widest text-zinc-500 font-bold mb-3">Start a Workout</div>
            <div className="space-y-2">
              {DAYS.map(d=>(
                <button key={d.id} onClick={()=>onStart(d.id)} className="w-full flex items-center justify-between p-4 rounded-2xl border border-zinc-800 bg-zinc-900 active:bg-zinc-800">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-xl border-2 flex items-center justify-center" style={{backgroundColor:d.color+"18",borderColor:d.color+"55"}}>
                      <span className="text-xl font-black" style={{color:d.color}}>{d.id}</span>
                    </div>
                    <div className="text-left">
                      <div className="font-black text-white text-xl leading-tight">Day {d.id} · {d.name}</div>
                      <div className="text-xs text-zinc-500">{d.exercises.length} exercises · ~45 min</div>
                    </div>
                  </div>
                  <span className="text-zinc-600">›</span>
                </button>
              ))}
            </div>
          </div>

          {/* Top PRs */}
          {topPrs.length>0&&(
            <div>
              <div className="text-xs uppercase tracking-widest text-zinc-500 font-bold mb-3">Personal Records</div>
              <div className="space-y-2">
                {topPrs.map(([name,pr])=>(
                  <div key={name} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex items-center justify-between">
                    <div><div className="font-black text-white text-lg leading-tight">{name}</div><div className="text-xs text-zinc-500">{pr.muscle} · {fmtDate(pr.date)}</div></div>
                    <div className="text-right"><div className="text-2xl font-black" style={{color:A}}>{pr.weight} kg</div><div className="text-xs text-zinc-500">× {pr.reps} reps</div></div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── COLLAPSIBLE ──────────────────────────────────────────────────────────
    function Collapsible({dotColor,title,subtitle,items,defaultOpen}){
      const [open,setOpen]=useState(defaultOpen);
      return (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
          <button onClick={()=>setOpen(!open)} className="w-full flex items-center justify-between px-4 py-3.5">
            <div className="flex items-center gap-3"><Dot color={dotColor} size={10}/><span className="font-black text-white uppercase tracking-wide">{title}</span><span className="text-xs text-zinc-600">{subtitle}</span></div>
            <span className="text-zinc-600 text-sm">{open?"▲":"▼"}</span>
          </button>
          {open&&<div className="px-4 pb-4 pt-2 space-y-2 border-t border-zinc-800">{items.map((item,i)=><div key={i} className="flex items-center gap-2 text-sm text-zinc-400"><Dot color={dotColor} size={6}/>{item}</div>)}</div>}
        </div>
      );
    }

    // ─── EXERCISE CARD ────────────────────────────────────────────────────────
    function ExerciseCard({ex,exIdx,onUpdateSet,onToggleSet,onAddSet}){
      const color=MC[ex.muscle]||"#98a8b4";
      return (
        <div className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden">
          <div className="px-4 py-3.5 border-b border-zinc-800 flex items-start gap-3">
            <Dot color={color} size={10}/><div><div className="font-black text-white text-xl leading-tight">{ex.name}</div><div className="text-xs font-bold uppercase tracking-widest mt-0.5" style={{color}}>{ex.muscle} · {ex.repsTarget} reps</div></div>
          </div>
          <div className="grid px-1" style={{gridTemplateColumns:"28px 1fr 68px 68px 38px"}}>
            {["#","Previous","kg","Reps","Done"].map(h=><div key={h} className="text-xs text-zinc-600 px-1 py-2.5 text-center font-bold uppercase tracking-wider">{h}</div>)}
          </div>
          {ex.sets.map((set,si)=>(
            <div key={si} className="grid px-1 border-t border-zinc-800/50 items-center" style={{gridTemplateColumns:"28px 1fr 68px 68px 38px",backgroundColor:set.completed?SAGE_DIM:"transparent"}}>
              <div className="text-center text-sm font-black text-zinc-500 py-2">{set.setNum}</div>
              <div className="text-xs text-zinc-600 py-2 px-1 truncate">{set.prevWeight?`${set.prevWeight}kg×${set.prevReps}`:"—"}</div>
              <div className="py-2 px-0.5"><input type="number" inputMode="decimal" value={set.weight} onChange={e=>onUpdateSet(exIdx,si,"weight",e.target.value)} className="w-full text-center py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-white font-black text-sm focus:outline-none"/></div>
              <div className="py-2 px-0.5"><input type="number" inputMode="numeric" value={set.reps} onChange={e=>onUpdateSet(exIdx,si,"reps",e.target.value)} className="w-full text-center py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-white font-black text-sm focus:outline-none"/></div>
              <div className="flex justify-center py-2"><button onClick={()=>onToggleSet(exIdx,si)} className="w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-black" style={set.completed?{backgroundColor:SAGE,borderColor:SAGE,color:"#fff"}:{borderColor:"#52525b",color:"transparent"}}>✓</button></div>
            </div>
          ))}
          <button onClick={onAddSet} className="w-full py-3 text-xs font-black uppercase tracking-widest border-t border-zinc-800 text-zinc-600 hover:text-zinc-400">+ Add Set</button>
        </div>
      );
    }

    // ─── WORKOUT SCREEN ───────────────────────────────────────────────────────
    function WorkoutScreen({workout,elapsed,showPicker,setShowPicker,onUpdateSet,onToggleSet,onAddSet,onAddExercise,onFinish,onDiscard}){
      if(!workout)return <div className="flex flex-col items-center justify-center min-h-96 text-center p-8"><div className="text-2xl font-black text-white uppercase mb-2">No Active Workout</div><div className="text-zinc-500 text-sm">Launch one from the Dashboard</div></div>;
      const completedSets=workout.exercises.reduce((n,ex)=>n+ex.sets.filter(s=>s.completed).length,0);
      const totalSets=workout.exercises.reduce((n,ex)=>n+ex.sets.length,0);
      return (
        <div>
          <div className="sticky top-0 z-10 border-b border-zinc-800 px-5 pt-5 pb-4" style={{backgroundColor:"rgba(9,9,11,0.96)"}}>
            <div className="flex items-start justify-between mb-3">
              <div>
                <div className="text-xs text-zinc-500 uppercase tracking-widest font-bold">{new Date(workout.date+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
                <div className="text-2xl font-black text-white uppercase leading-tight">{workout.name}</div>
                <div className="text-xs text-zinc-500 mt-0.5">{completedSets} / {totalSets} sets complete</div>
              </div>
              <div className="rounded-xl px-3 py-2.5 text-right" style={{backgroundColor:A_DIM,border:`1px solid ${A_RING}`}}>
                <div className="font-mono font-black text-2xl leading-none" style={{color:A}}>{fmtElap(elapsed)}</div>
                <div className="text-xs text-zinc-500 mt-0.5">elapsed</div>
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={onFinish} className="flex-1 text-white font-black py-3 px-4 rounded-xl text-sm uppercase tracking-wider" style={{backgroundColor:A}}>Finish Workout</button>
              <button onClick={onDiscard} className="bg-zinc-800 text-zinc-400 font-black py-3 px-4 rounded-xl text-sm uppercase tracking-wider">Discard</button>
            </div>
          </div>
          <div className="p-5 space-y-4 pb-10">
            <Collapsible dotColor="#c8a888" title="Warm-Up" subtitle="5 min" defaultOpen={true} items={["5 min light cardio — treadmill or stationary bike","10 leg swings each side","10 arm circles forward and backward","10 hip circles each direction","Cat-cow stretch × 10 slow reps","Bird-dog × 10 each side"]}/>
            {workout.exercises.map((ex,ei)=><ExerciseCard key={`${ex.name}-${ei}`} ex={ex} exIdx={ei} onUpdateSet={onUpdateSet} onToggleSet={onToggleSet} onAddSet={()=>onAddSet(ei)}/>)}
            <button onClick={()=>setShowPicker(true)} className="w-full border-2 border-dashed border-zinc-700 text-zinc-500 font-black py-4 rounded-2xl text-sm uppercase tracking-widest hover:border-zinc-600">+ Add Exercise</button>
            <Collapsible dotColor={A} title="Cool Down" subtitle="5–10 min" defaultOpen={false} items={["Child's pose hold 45–60 seconds","Hip flexor stretch 30s each side","Seated hamstring stretch 30s each side","Chest doorway stretch 30 seconds","Thoracic foam roll 60 seconds","5 deep diaphragmatic breaths"]}/>
          </div>
          {showPicker&&(
            <div className="fixed inset-0 z-50 flex flex-col justify-end" style={{backgroundColor:"rgba(0,0,0,0.70)"}} onClick={e=>{if(e.target===e.currentTarget)setShowPicker(false);}}>
              <div className="bg-zinc-900 rounded-t-3xl max-h-96 flex flex-col" style={{borderTop:`1px solid ${A_RING}`,paddingBottom:"max(16px,env(safe-area-inset-bottom))"}}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-800 flex-shrink-0">
                  <span className="font-black text-xl text-white uppercase tracking-wide">Add Exercise</span>
                  <button onClick={()=>setShowPicker(false)} className="text-zinc-400 text-3xl leading-none">×</button>
                </div>
                <div className="overflow-y-auto">{ALL_EX.map(ex=><button key={ex.name} onClick={()=>onAddExercise(ex)} className="w-full flex items-center justify-between px-5 py-4 hover:bg-zinc-800 border-b border-zinc-800/50"><span className="font-bold text-white text-lg">{ex.name}</span><span className="text-xs font-black uppercase tracking-wider" style={{color:MC[ex.muscle]||"#98a8b4"}}>{ex.muscle}</span></button>)}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── HISTORY ──────────────────────────────────────────────────────────────
    function HistoryScreen({history,onExport,onSendReport,sending}){
      const sorted=[...history].sort((a,b)=>b.date.localeCompare(a.date));
      return (
        <div className="p-5 space-y-3">
          <div className="flex items-center justify-between">
            <div><h1 className="text-3xl font-black text-white uppercase tracking-wide">History</h1><div className="text-xs text-zinc-500 uppercase tracking-widest font-bold">{history.length} sessions</div></div>
            <div className="flex gap-2">
              <button onClick={onSendReport} disabled={sending||!EMAILJS_READY} className="text-xs font-black uppercase tracking-wider px-3 py-2.5 rounded-xl disabled:opacity-40" style={{backgroundColor:"rgba(200,176,140,0.12)",border:`1px solid rgba(200,176,140,0.30)`,color:SAND}}>{sending?"Sending…":"Email"}</button>
              <button onClick={onExport} className="text-xs font-black uppercase tracking-wider px-3 py-2.5 rounded-xl" style={{backgroundColor:A_DIM,border:`1px solid ${A_RING}`,color:A}}>Export</button>
            </div>
          </div>
          {sorted.map(w=>{
            const day=DAYS.find(d=>d.id===w.dayId);
            const totalSets=w.exercises.reduce((n,e)=>n+e.sets.length,0);
            return (
              <div key={w.id} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
                <div className="flex items-start justify-between mb-2">
                  <div>
                    <div className="flex items-center gap-2 flex-wrap"><span className="font-black text-xl" style={{color:day?.color||"#98a8b4"}}>{w.name}</span>{w.prs&&w.prs.length>0&&<span className="text-xs font-black px-2 py-0.5 rounded-full" style={{backgroundColor:"rgba(200,176,140,0.15)",color:SAND,border:"1px solid rgba(200,176,140,0.25)"}}>{w.prs.length} PR{w.prs.length>1?"s":""}</span>}</div>
                    <div className="text-xs text-zinc-500 mt-0.5">{fmtDate(w.date)} · {fmtDur(w.duration)} · {totalSets} sets</div>
                  </div>
                </div>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {w.exercises.map(ex=><span key={ex.name} className="text-xs font-bold px-2.5 py-0.5 rounded-full border flex items-center gap-1.5" style={{borderColor:(MC[ex.muscle]||"#98a8b4")+"40",color:MC[ex.muscle]||"#98a8b4",backgroundColor:(MC[ex.muscle]||"#98a8b4")+"0e"}}>{w.prs&&w.prs.includes(ex.name)&&<PrBadge/>}{ex.name}</span>)}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─── PROGRESS ─────────────────────────────────────────────────────────────
    function ProgressScreen({history,prs,prOverrides,onEditPr}){
      const weeklyData=useMemo(()=>{
        const weeks={};
        history.forEach(w=>{const d=new Date(w.date+"T00:00:00"),dow=d.getDay(),mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1));const key=mon.toISOString().split("T")[0],label=`${mon.getDate()}/${mon.getMonth()+1}`;if(!weeks[key])weeks[key]={week:key,label};w.exercises.forEach(ex=>{const n=ex.sets.filter(s=>s.completed).length;if(n>0)weeks[key][ex.muscle]=(weeks[key][ex.muscle]||0)+n;});});
        return Object.values(weeks).sort((a,b)=>a.week.localeCompare(b.week)).slice(-8);
      },[history]);
      const exTrends=useMemo(()=>{
        const map={};
        history.forEach(w=>w.exercises.forEach(ex=>{if(ex.repsTarget.includes("s"))return;const mx=Math.max(...ex.sets.filter(s=>s.completed).map(s=>s.weight||0));if(mx>0){if(!map[ex.name])map[ex.name]={pts:[],muscle:ex.muscle};map[ex.name].pts.push({date:w.date,weight:mx});}}));
        return Object.entries(map).filter(([,v])=>v.pts.length>=3).map(([name,v])=>({name,muscle:v.muscle,pts:v.pts.sort((a,b)=>a.date.localeCompare(b.date))})).slice(0,8);
      },[history]);
      const mergedPrs=useMemo(()=>{
        const m={...prs};
        Object.entries(prOverrides).forEach(([name,ov])=>{m[name]={...(m[name]||{}),weight:ov.weight,date:ov.date||new Date().toISOString().split("T")[0],muscle:ov.muscle||(m[name]?.muscle||"")};});
        return m;
      },[prs,prOverrides]);
      const usedMuscles=[...new Set(Object.values(mergedPrs).map(p=>p.muscle))];
      return (
        <div className="p-5 space-y-4">
          <h1 className="text-3xl font-black text-white uppercase tracking-wide">Progress</h1>
          <div className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
            <div className="text-xs font-black text-zinc-400 uppercase tracking-widest mb-1">Weekly Volume</div>
            <div className="text-xs text-zinc-600 mb-4">Sets per muscle group · last 8 weeks</div>
            <StackedBarChart data={weeklyData} muscles={usedMuscles}/>
            <div className="flex flex-wrap gap-2 mt-3">{usedMuscles.map(m=><div key={m} className="flex items-center gap-1"><Dot color={MC[m]||"#98a8b4"} size={7}/><span className="text-xs text-zinc-500 font-bold">{m}</span></div>)}</div>
          </div>
          <div>
            <div className="text-xs font-black text-zinc-400 uppercase tracking-widest mb-3">Exercise Trends</div>
            <div className="space-y-3">
              {exTrends.map(({name,muscle,pts})=>{
                const pr=mergedPrs[name],color=MC[muscle]||"#98a8b4";
                const gain=pts.length>=2?+(pts[pts.length-1].weight-pts[0].weight).toFixed(1):0;
                return (
                  <div key={name} className="bg-zinc-900 border border-zinc-800 rounded-2xl p-4">
                    <div className="flex items-start justify-between mb-3">
                      <div className="flex items-start gap-2"><Dot color={color} size={8}/><div><div className="font-black text-white text-lg leading-tight">{name}</div><div className="text-xs font-black uppercase tracking-widest" style={{color}}>{muscle}</div>{gain>0&&<div className="text-xs font-bold mt-0.5" style={{color:SAGE}}>+{gain} kg since start</div>}</div></div>
                      <div className="flex items-center gap-2">
                        {pr&&<div className="text-right"><div className="text-2xl font-black leading-none" style={{color}}>{pr.weight} kg</div><div className="flex items-center justify-end gap-1 mt-0.5"><PrBadge/><span className="text-xs text-zinc-600">{fmtDate(pr.date)}</span></div></div>}
                        <button onClick={()=>onEditPr(name,muscle,pr)} className="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style={{backgroundColor:"rgba(255,255,255,0.05)",border:"1px solid #3f3f46"}}>
                          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#71717a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                      </div>
                    </div>
                    <Sparkline data={pts} color={color} height={56}/>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─── GROCERY LIST ─────────────────────────────────────────────────────────
    function GroceryList(){

    async function analyzeFood(base64, mediaType, apiKey){
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"x-api-key":apiKey,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({
          model:"claude-haiku-4-5-20251001",max_tokens:1024,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
            {type:"text",text:'Identify all food items in this image and estimate their nutritional content. Return ONLY valid JSON (no markdown, no code blocks): {"foods":[{"name":"...","estimated_grams":100,"calories":0,"protein_g":0,"carbs_g":0,"fat_g":0,"confidence":"high"|"medium"|"low"}],"needs_portion_info":false,"notes":""}. Use typical Mediterranean serving sizes. If portion is unclear set needs_portion_info:true and base values on 100g. Be specific and accurate.'}
          ]}]
        })
      });
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`API error ${res.status}`);}
      const data=await res.json();
      const txt=data.content[0].text;
      const m=txt.match(/\{[\s\S]*\}/);
      if(!m)throw new Error("Could not parse response");
      return JSON.parse(m[0]);
    }

          <div className="w-full bg-zinc-800 rounded-full h-1.5 overflow-hidden"><div className="h-full rounded-full transition-all" style={{width:`${pct}%`,backgroundColor:color}}/></div>
        </div>
      );
    }

              {day.meals.map(m=>{
                const sc=SLOT_COLORS[m.slot]||A;
                return (
                  <div key={m.slot} className="rounded-xl p-3" style={{backgroundColor:sc+"12",border:`1px solid ${sc}22`}}>
                    <div className="flex items-center justify-between mb-1"><div className="flex items-center gap-2"><Dot color={sc} size={7}/><span className="text-xs font-black uppercase tracking-widest" style={{color:sc}}>{m.slot}</span>{m.shake&&<span className="text-xs font-black px-1.5 py-0.5 rounded" style={{backgroundColor:"rgba(138,180,212,0.15)",color:A}}>Shake</span>}</div><div className="text-right"><span className="font-black text-sm text-white">{m.kcal} kcal</span><span className="text-xs text-zinc-600 ml-2">{m.protein}g P</span></div></div>
                    <div className="font-black text-white text-base leading-tight">{m.name}</div>
                    <div className="text-xs text-zinc-500 mt-1 leading-snug">{m.desc}</div>
                  </div>
                );
              })}
            </div>
          </div>
          <button onClick={()=>setShowSupp(!showSupp)} className="w-full py-3 rounded-xl text-sm font-black uppercase tracking-widest" style={showSupp?{backgroundColor:"rgba(200,176,140,0.12)",border:`1px solid rgba(200,176,140,0.30)`,color:SAND}:{backgroundColor:"rgba(255,255,255,0.03)",border:"1px solid #3f3f46",color:"#71717a"}}>
            {showSupp?"Hide":"Show"} Supplement Protocol
          </button>
          {showSupp&&<div className="space-y-3">{SUPPS.map(s=><Collapsible key={s.time} dotColor={s.color} title={s.time} subtitle="" items={s.items} defaultOpen={true}/>)}</div>}
        </div>
      );
    }

    // ─── NUTRITION SCREEN ─────────────────────────────────────────────────────
    function NutritionScreen({profile}){
      const [view,setView]=useState("log");
      return (
        <div className="p-5 space-y-4">
          <h1 className="text-3xl font-black text-white uppercase tracking-wide">Nutrition</h1>
          <div className="flex gap-2">
            {[{id:"log",label:"Calorie Log"},{id:"plan",label:"Meal Plan"},{id:"grocery",label:"Grocery"}].map(t=>(
              <button key={t.id} onClick={()=>setView(t.id)} className="flex-1 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider"
                style={view===t.id?{backgroundColor:A_DIM,border:`1px solid ${A_RING}`,color:A}:{backgroundColor:"rgba(255,255,255,0.03)",border:"1px solid transparent",color:"#52525b"}}>
                {t.label}
              </button>
            ))}
          </div>
          {view==="log"&&<CalorieLog profile={profile}/>}
          {view==="plan"&&<MealPlanView/>}
          {view==="grocery"&&<GroceryList/>}
        </div>
      );
    }

    // ─── BOTTOM NAV ───────────────────────────────────────────────────────────
    function BottomNav({screen,setScreen,activeWorkout}){
      const tabs=[
        {id:"dashboard",label:"Home",icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>},
        {id:"workout",label:"Workout",icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><line x1="4" y1="12" x2="20" y2="12"/></svg>,badge:activeWorkout},
        {id:"history",label:"History",icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>},
        {id:"progress",label:"Progress",icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>},
        {id:"nutrition",label:"Nutrition",icon:<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 2C6.5 2 2 6.5 2 11c0 4.5 4.5 9 9 9 2 0 4-.7 5.6-2l3.7 3.7a1 1 0 0 0 1.4-1.4l-3.7-3.7C19.3 15 20 13 20 11 20 6.5 15.5 2 11 2z"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>},
      ];
      return (
        <div className="fixed bottom-0 left-0 right-0 z-20 border-t border-zinc-800" style={{backgroundColor:"rgba(9,9,11,0.97)",paddingBottom:"max(16px,env(safe-area-inset-bottom))"}}>
          <div className="flex max-w-md mx-auto">
            {tabs.map(t=>{
              const active=screen===t.id;
              return (
                <button key={t.id} onClick={()=>setScreen(t.id)} className="flex-1 flex flex-col items-center gap-1 pt-3 pb-1 relative">
                  {t.badge&&<span className="absolute top-2 right-1/2 -mr-3 w-2 h-2 rounded-full" style={{backgroundColor:SAGE}}/>}
                  <span style={{color:active?A:"#52525b"}}>{t.icon}</span>
                  <span className="text-xs font-black uppercase tracking-wider" style={{color:active?A:"#52525b"}}>{t.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ─── ROOT ─────────────────────────────────────────────────────────────────
    function FitnessTracker(){
      const [screen,setScreen]=useState("dashboard");
      const [history,setHistory]=useState([]);
      const [prs,setPrs]=useState({});
      const [prOverrides,setPrOverrides]=useState(()=>{try{return JSON.parse(localStorage.getItem("pr_overrides")||"{}");}catch{return {};}});
      const [activeWorkout,setActiveWorkout]=useState(null);
      const [elapsed,setElapsed]=useState(0);
      const [showPicker,setShowPicker]=useState(false);
      const [loading,setLoading]=useState(true);
      const [toast,setToast]=useState(null);
      const [sending,setSending]=useState(false);
      const [profile,setProfile]=useState(()=>{try{return JSON.parse(localStorage.getItem("profile"))||DEFAULT_PROFILE;}catch{return DEFAULT_PROFILE;}});
      const [showEditProfile,setShowEditProfile]=useState(false);
      const [editPr,setEditPr]=useState(null); // {name, muscle, current}
      const dbRef=useRef(null);
      const toastTimerRef=useRef(null);

      const showToast=(message,type="info",duration=2500)=>{
        setToast({message,type});
        if(toastTimerRef.current)clearTimeout(toastTimerRef.current);
        toastTimerRef.current=setTimeout(()=>setToast(null),duration);
      };

      useEffect(()=>{
        async function init(){
          try{
            const db=await openDB();dbRef.current=db;
            const stored=await idbGetAll(db);
            if(stored.length===0){const seed=genHistory();await idbPutBatch(db,seed);setHistory(seed);setPrs(computePRs(seed));}
            else{const sorted=stored.sort((a,b)=>a.date.localeCompare(b.date));setHistory(sorted);setPrs(computePRs(sorted));}
          }catch(err){const seed=genHistory();setHistory(seed);setPrs(computePRs(seed));}
          setLoading(false);
        }
        init();
      },[]);

      useEffect(()=>{
        if(!activeWorkout)return;
        const id=setInterval(()=>setElapsed(e=>e+1),1000);
        return()=>clearInterval(id);
      },[activeWorkout]);

      function startWorkout(dayId){
        const day=DAYS.find(d=>d.id===dayId);
        const lastW=[...history].reverse().find(w=>w.dayId===dayId);
        const exercises=day.exercises.map(ex=>{
          const lastEx=lastW?.exercises.find(e=>e.name===ex.name);
          const prevWeight=lastEx?Math.max(...lastEx.sets.map(s=>s.weight)):null;
          const prevReps=lastEx?lastEx.sets.find(s=>s.completed)?.reps||null:null;
          return{name:ex.name,muscle:ex.muscle,repsTarget:ex.rep,sets:Array.from({length:ex.sets},(_,si)=>({setNum:si+1,weight:prevWeight||SW[ex.name]||0,reps:prevReps||(ex.rep.includes("s")?0:12),completed:false,prevWeight,prevReps}))};
        });
        setActiveWorkout({id:`w${Date.now()}`,dayId,name:day.name,date:new Date().toISOString().split("T")[0],duration:0,exercises,prs:[]});
        setElapsed(0);setScreen("workout");
      }

      function updateSet(exIdx,si,field,val){
        setActiveWorkout(w=>{const next=structuredClone(w);next.exercises[exIdx].sets[si][field]=field==="weight"?parseFloat(val)||0:parseInt(val)||0;return next;});
      }
      function toggleSet(exIdx,si){setActiveWorkout(w=>{const next=structuredClone(w);next.exercises[exIdx].sets[si].completed=!next.exercises[exIdx].sets[si].completed;return next;});}
      function addSet(exIdx){setActiveWorkout(w=>{const next=structuredClone(w);const sets=next.exercises[exIdx].sets;const last=sets[sets.length-1];sets.push({setNum:last.setNum+1,weight:last.weight,reps:last.reps,completed:false});return next;});}
      function addExercise(ex){
        setActiveWorkout(w=>{const next=structuredClone(w);next.exercises.push({name:ex.name,muscle:ex.muscle,repsTarget:"12–15",sets:[{setNum:1,weight:SW[ex.name]||0,reps:12,completed:false}]});return next;});
        setShowPicker(false);
      }

      async function finishWorkout(){
        if(!activeWorkout)return;
        const w={...activeWorkout,duration:elapsed};
        const newPrs=[...w.prs];
        w.exercises.forEach(ex=>{
          if(ex.repsTarget.includes("s"))return;
          const mx=Math.max(...ex.sets.filter(s=>s.completed).map(s=>s.weight||0));
          if(mx>0&&(!prs[ex.name]||mx>prs[ex.name].weight)){if(!newPrs.includes(ex.name))newPrs.push(ex.name);}
        });
        w.prs=newPrs;
        const newHistory=[...history,w].sort((a,b)=>a.date.localeCompare(b.date));
        setHistory(newHistory);setPrs(computePRs(newHistory));
        try{if(dbRef.current)await idbPut(dbRef.current,w);}catch{}
        setActiveWorkout(null);setElapsed(0);setScreen("history");
        showToast(newPrs.length>0?`Workout done! ${newPrs.length} new PR${newPrs.length>1?"s":""}!`:"Workout saved!","saved");
      }
      function discard(){setActiveWorkout(null);setElapsed(0);setScreen("dashboard");}

      async function handleSendReport(){
        if(!EMAILJS_READY){showToast("EmailJS not configured","error",4000);return;}
        setSending(true);
        try{await sendWeeklyReport(history,prs,profile);showToast(`Report sent to ${REPORT_EMAIL}`,"saved");}
        catch(err){showToast("Failed to send — check EmailJS config","error",4000);}
        setSending(false);
      }

      function exportData(){
        const json=JSON.stringify({exported:new Date().toISOString(),workouts:history},null,2);
        const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(json);a.download=`fitness-backup-${new Date().toISOString().split("T")[0]}.json`;a.click();
      }

      function saveProfile(p){
        setProfile(p);try{localStorage.setItem("profile",JSON.stringify(p));}catch{}
        setShowEditProfile(false);showToast("Profile updated","saved");
      }

      function saveEditPr(name,weight){
        const muscle=editPr.muscle||prs[name]?.muscle||"";
        const ov={...prOverrides,[name]:{weight,date:new Date().toISOString().split("T")[0],muscle}};
        setPrOverrides(ov);try{localStorage.setItem("pr_overrides",JSON.stringify(ov));}catch{}
        setEditPr(null);showToast("PR updated","saved");
      }

      if(loading)return <div className="flex flex-col items-center justify-center min-h-screen bg-zinc-950 gap-3"><div style={{width:40,height:40,border:"3px solid #27272a",borderTopColor:A,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/><div className="text-zinc-600 text-xs font-black uppercase tracking-widest">Loading</div></div>;

      const topPad="max(20px,env(safe-area-inset-top))";
      const botPad="calc(max(16px,env(safe-area-inset-bottom)) + 65px)";

      return (
        <div className="bg-zinc-950 min-h-screen text-white flex flex-col max-w-md mx-auto relative">
          {toast&&<Toast message={toast.message} type={toast.type}/>}
          <div className="flex-1 overflow-y-auto" style={{paddingTop:topPad,paddingBottom:botPad}}>
            {screen==="dashboard"&&<Dashboard history={history} prs={prs} profile={profile} onStart={startWorkout} onSendReport={handleSendReport} sending={sending} onEditProfile={()=>setShowEditProfile(true)}/>}
            {screen==="workout"&&<WorkoutScreen workout={activeWorkout} elapsed={elapsed} showPicker={showPicker} setShowPicker={setShowPicker} onUpdateSet={updateSet} onToggleSet={toggleSet} onAddSet={addSet} onAddExercise={addExercise} onFinish={finishWorkout} onDiscard={discard}/>}
            {screen==="history"&&<HistoryScreen history={history} onExport={exportData} onSendReport={handleSendReport} sending={sending}/>}
            {screen==="progress"&&<ProgressScreen history={history} prs={prs} prOverrides={prOverrides} onEditPr={(name,muscle,current)=>setEditPr({name,muscle,current})}/>}
            {screen==="nutrition"&&<NutritionScreen profile={profile}/>}
          </div>
          <BottomNav screen={screen} setScreen={setScreen} activeWorkout={activeWorkout}/>
          {showEditProfile&&<EditProfileModal profile={profile} onSave={saveProfile} onClose={()=>setShowEditProfile(false)}/>}
          {editPr&&<EditPrModal name={editPr.name} muscle={editPr.muscle} current={editPr.current} onSave={saveEditPr} onClose={()=>setEditPr(null)}/>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<FitnessTracker/>);
  </script>
</body>
</html>
